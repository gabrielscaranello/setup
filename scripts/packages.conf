docker-buildx               | -                       | docker-buildx-plugin    | docker-buildx
docker-compose              | docker-compose          | docker-compose-plugin   | docker-compose
firefox-i18n-pt-br          | firefox-l10n-pt-br      | -                       | firefox-i18n-pt-br
fonts-carlito               | -                       | -                       | ttf-carlito
fonts-jetbrains-mono-nerd   | -                       | -                       | ttf-jetbrains-mono-nerd
fonts-liberation            | fonts-liberation        | -                       | ttf-liberation
fonts-noto                  | -                       | -                       | noto-fonts
fonts-noto-color-emoji      | fonts-noto-color-emoji  | -                       | noto-fonts-emoji
fonts-roboto                | fonts-roboto            | google-roboto-fonts     | ttf-roboto
gcc-cxx                     | g++                     | gcc-c++                 | gcc
gettext-tools               | gettext                 | gettext-devel           | gettext
golang                      | golang                  | golang                  | go
